# GitHub Pages 주소 (배포 시에는 Actions 가 이 값을 자동으로 덮어씀)
baseURL = "https://gyeonguk1545-spec.github.io/semi-process-digest/"
locale = "ko-KR"
defaultContentLanguage = "ko"
title = "반도체 공정 주간 노트"
enableRobotsTXT = true

[params]
  description = "반도체 공정 기술 동향을 매주 정리하는 학습 노트. 뉴스·논문 요약 + 배경 지식 + 면접 질문."
  author = "C-beam Lab 대학원생"

[taxonomies]
  tag = "tags"

[markup.goldmark.renderer]
  unsafe = true   # 본문에 <details> 같은 HTML 사용 허용

[markup.highlight]
  noClasses = true

[menus]
  [[menus.main]]
    name = "주간 글"
    pageRef = "/posts"
    weight = 1
  [[menus.main]]
    name = "태그"
    pageRef = "/tags"
    weight = 2
  [[menus.main]]
    name = "소개"
    pageRef = "/about"
    weight = 3
