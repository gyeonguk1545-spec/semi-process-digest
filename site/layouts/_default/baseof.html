<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Params.summary }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}{{ end }}">
  <link rel="stylesheet" href="{{ "css/main.css" | relURL }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='4' y='4' width='24' height='24' rx='4' fill='%232b6cb0'/><path d='M10 12h12M10 16h12M10 20h8' stroke='white' stroke-width='2'/></svg>">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ "/" | relURL }}">{{ site.Title }}</a>
      <nav>
        {{ range site.Menus.main }}<a href="{{ .URL }}">{{ .Name }}</a>{{ end }}
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ block "main" . }}{{ end }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      뉴스·논문은 요약과 원문 링크만 싣습니다. 그림은 직접 그린 것이거나 자유 라이선스 자료이며 각 그림 아래에 출처를 표기합니다.
    </div>
  </footer>
</body>
</html>
