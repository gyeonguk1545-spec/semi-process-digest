<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <rect width="860" height="400" fill="#ffffff"/>
  <text x="430" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#222">소스→드레인 방향 전도대(E_C) 에너지: 긴 채널 vs 짧은 채널</text>
  <!-- panel a -->
  <g transform="translate(40,60)">
    <text x="180" y="0" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">(a) 긴 채널</text>
    <line x1="0" y1="290" x2="360" y2="290" stroke="#999"/>
    <text x="40" y="312" text-anchor="middle" font-size="13" fill="#555">소스</text>
    <text x="180" y="312" text-anchor="middle" font-size="13" fill="#555">채널 (게이트 아래)</text>
    <text x="320" y="312" text-anchor="middle" font-size="13" fill="#555">드레인</text>
    <!-- V_D low (dashed) -->
    <path d="M0,180 L60,180 C90,180 90,90 120,90 L240,90 C270,90 270,190 300,190 L360,190" fill="none" stroke="#7a9cc6" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- V_D high -->
    <path d="M0,180 L60,180 C90,180 90,90 120,90 L240,90 C270,90 280,250 310,250 L360,250" fill="none" stroke="#1f4e8c" stroke-width="3"/>
    <line x1="60" y1="180" x2="60" y2="90" stroke="#c0392b" stroke-width="1.5" marker-end="url(#ar)"/>
    <text x="68" y="140" font-size="13" fill="#c0392b">장벽 높이</text>
    <text x="180" y="78" text-anchor="middle" font-size="13" fill="#1f4e8c">장벽이 넓고 평평 — 게이트가 지배</text>
    <text x="180" y="350" text-anchor="middle" font-size="13" fill="#333">V_D를 올려도 장벽 꼭대기는 그대로</text>
  </g>
  <!-- panel b -->
  <g transform="translate(460,60)">
    <text x="180" y="0" text-anchor="middle" font-size="15" font-weight="bold" fill="#333">(b) 짧은 채널</text>
    <line x1="0" y1="290" x2="360" y2="290" stroke="#999"/>
    <text x="40" y="312" text-anchor="middle" font-size="13" fill="#555">소스</text>
    <text x="180" y="312" text-anchor="middle" font-size="13" fill="#555">채널</text>
    <text x="320" y="312" text-anchor="middle" font-size="13" fill="#555">드레인</text>
    <path d="M0,180 L110,180 C140,180 150,95 180,95 C210,95 220,190 250,190 L360,190" fill="none" stroke="#7a9cc6" stroke-width="2" stroke-dasharray="6,4"/>
    <path d="M0,180 L110,180 C140,180 150,130 172,130 C200,130 215,250 250,250 L360,250" fill="none" stroke="#1f4e8c" stroke-width="3"/>
    <line x1="182" y1="95" x2="182" y2="126" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
    <text x="192" y="112" font-size="13" fill="#c0392b">장벽 낮아짐 (DIBL)</text>
    <text x="180" y="78" text-anchor="middle" font-size="13" fill="#1f4e8c">드레인 전기장이 장벽까지 닿음</text>
    <text x="180" y="350" text-anchor="middle" font-size="13" fill="#333">V_D↑ → 장벽↓ → V_T↓, 꺼짐 누설↑</text>
  </g>
  <g transform="translate(250,385)" font-size="13" fill="#333">
    <line x1="0" y1="-4" x2="30" y2="-4" stroke="#7a9cc6" stroke-width="2" stroke-dasharray="6,4"/><text x="38" y="0">낮은 드레인 전압</text>
    <line x1="190" y1="-4" x2="220" y2="-4" stroke="#1f4e8c" stroke-width="3"/><text x="228" y="0">높은 드레인 전압</text>
  </g>
  <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker></defs>
</svg>
