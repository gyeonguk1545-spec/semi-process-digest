<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <rect width="880" height="400" fill="#ffffff"/>
  <defs>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c53030"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1f3d66"/></marker>
  </defs>

  <!-- (a) 쇼트키 -->
  <text x="215" y="30" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328">(a) 쇼트키 접합 (금속 / 저농도 n형)</text>
  <rect x="40" y="60" width="110" height="250" fill="#a0aec0"/>
  <rect x="40" y="185" width="110" height="125" fill="#718096"/>
  <text x="95" y="330" font-size="13" text-anchor="middle" fill="#1f2328">금속</text>
  <line x1="40" y1="185" x2="400" y2="185" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="402" y="189" font-size="12" fill="#4a5568">E_F</text>
  <path d="M150 105 C 200 105, 230 160, 290 160 L 400 160" fill="none" stroke="#2b6cb0" stroke-width="3"/>
  <path d="M150 215 C 200 215, 230 270, 290 270 L 400 270" fill="none" stroke="#2f855a" stroke-width="3"/>
  <text x="402" y="164" font-size="12" fill="#2b6cb0">E_c</text>
  <text x="402" y="274" font-size="12" fill="#2f855a">E_v</text>
  <rect x="150" y="60" width="110" height="250" fill="#ecc94b" opacity="0.15"/>
  <text x="205" y="330" font-size="12" text-anchor="middle" fill="#744210">넓은 공핍층</text>
  <line x1="165" y1="185" x2="165" y2="108" stroke="#c53030" stroke-width="1.5" marker-end="url(#r)"/>
  <text x="172" y="98" font-size="12" fill="#c53030">qφ_B (쇼트키 장벽)</text>
  <text x="215" y="360" font-size="12.5" text-anchor="middle" fill="#444">장벽을 넘는 열전자 방출 → 정류 특성</text>
  <text x="215" y="378" font-size="12.5" text-anchor="middle" fill="#444">다수 캐리어 소자: 빠른 스위칭, 낮은 순방향 전압</text>

  <!-- (b) 오믹 -->
  <text x="660" y="30" font-size="15" font-weight="700" text-anchor="middle" fill="#1f2328">(b) 오믹 접촉 (금속 / 고농도 n⁺)</text>
  <rect x="470" y="60" width="110" height="250" fill="#a0aec0"/>
  <rect x="470" y="185" width="110" height="125" fill="#718096"/>
  <text x="525" y="330" font-size="13" text-anchor="middle" fill="#1f2328">금속</text>
  <line x1="470" y1="185" x2="830" y2="185" stroke="#4a5568" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="832" y="189" font-size="12" fill="#4a5568">E_F</text>
  <path d="M580 105 C 592 105, 598 175, 612 175 L 830 175" fill="none" stroke="#2b6cb0" stroke-width="3"/>
  <path d="M580 215 C 592 215, 598 285, 612 285 L 830 285" fill="none" stroke="#2f855a" stroke-width="3"/>
  <text x="832" y="171" font-size="12" fill="#2b6cb0">E_c</text>
  <text x="832" y="289" font-size="12" fill="#2f855a">E_v</text>
  <rect x="580" y="60" width="32" height="250" fill="#ecc94b" opacity="0.25"/>
  <line x1="640" y1="182" x2="568" y2="182" stroke="#1f3d66" stroke-width="2" marker-end="url(#b)"/>
  <line x1="566" y1="190" x2="638" y2="190" stroke="#1f3d66" stroke-width="2" marker-end="url(#b)"/>
  <text x="650" y="140" font-size="12" fill="#1f3d66">얇은 장벽을 양방향 터널링</text>
  <text x="660" y="360" font-size="12.5" text-anchor="middle" fill="#444">공핍층이 수 nm로 얇아 전류가 양방향으로 흐름</text>
  <text x="660" y="378" font-size="12.5" text-anchor="middle" fill="#444">I-V가 직선(저항처럼) → 소스·드레인 컨택에 필요</text>
</svg>
