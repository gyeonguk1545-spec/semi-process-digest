<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <rect width="880" height="400" fill="#ffffff"/>
  <defs>
    <g id="si"><circle r="17" fill="#cbd5e0" stroke="#4a5568" stroke-width="1.5"/><text y="5" font-size="13" text-anchor="middle" fill="#2d3748">Si</text></g>
  </defs>

  <!-- n형 격자 -->
  <text x="150" y="30" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">n형: 인(P, 5족) 도핑</text>
  <g transform="translate(40,50)" stroke="#718096" stroke-width="3">
    <line x1="40" y1="40" x2="180" y2="40"/><line x1="40" y1="110" x2="180" y2="110"/><line x1="40" y1="180" x2="180" y2="180"/>
    <line x1="40" y1="40" x2="40" y2="180"/><line x1="110" y1="40" x2="110" y2="180"/><line x1="180" y1="40" x2="180" y2="180"/>
  </g>
  <g transform="translate(40,50)">
    <use href="#si" x="40" y="40"/><use href="#si" x="110" y="40"/><use href="#si" x="180" y="40"/>
    <use href="#si" x="40" y="110"/><use href="#si" x="180" y="110"/>
    <use href="#si" x="40" y="180"/><use href="#si" x="110" y="180"/><use href="#si" x="180" y="180"/>
    <circle cx="110" cy="110" r="19" fill="#f6ad55" stroke="#9c6b2a" stroke-width="2"/><text x="110" y="115" font-size="13" text-anchor="middle" font-weight="700" fill="#5a3a10">P</text>
    <circle cx="140" cy="88" r="6" fill="#1f3d66"/>
    <path d="M128 98 Q 150 70 160 95" fill="none" stroke="#1f3d66" stroke-dasharray="3 2"/>
    <text x="200" y="88" font-size="12" fill="#1f3d66">남는 전자 1개</text>
    <text x="200" y="104" font-size="12" fill="#1f3d66">→ 쉽게 떨어져 자유전자</text>
  </g>
  <text x="150" y="282" font-size="12.5" fill="#444" text-anchor="middle">P⁺ 이온은 격자에 고정 (도너)</text>

  <!-- p형 격자 -->
  <text x="450" y="30" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">p형: 붕소(B, 3족) 도핑</text>
  <g transform="translate(340,50)" stroke="#718096" stroke-width="3">
    <line x1="40" y1="40" x2="180" y2="40"/><line x1="40" y1="110" x2="180" y2="110"/><line x1="40" y1="180" x2="180" y2="180"/>
    <line x1="40" y1="40" x2="40" y2="180"/><line x1="110" y1="40" x2="110" y2="180"/><line x1="180" y1="40" x2="180" y2="180"/>
  </g>
  <g transform="translate(340,50)">
    <use href="#si" x="40" y="40"/><use href="#si" x="110" y="40"/><use href="#si" x="180" y="40"/>
    <use href="#si" x="40" y="110"/><use href="#si" x="180" y="110"/>
    <use href="#si" x="40" y="180"/><use href="#si" x="110" y="180"/><use href="#si" x="180" y="180"/>
    <circle cx="110" cy="110" r="19" fill="#9ae6b4" stroke="#2f855a" stroke-width="2"/><text x="110" y="115" font-size="13" text-anchor="middle" font-weight="700" fill="#22543d">B</text>
    <circle cx="145" cy="110" r="6" fill="#ffffff" stroke="#c53030" stroke-width="2"/>
    <text x="150" y="140" font-size="12" fill="#c53030">빈 결합 = 정공</text>
  </g>
  <text x="450" y="282" font-size="12.5" fill="#444" text-anchor="middle">B⁻ 이온은 격자에 고정 (억셉터)</text>

  <!-- 밴드 그림 -->
  <text x="745" y="30" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">밴드 그림에서 보면</text>
  <g transform="translate(640,50)">
    <!-- n -->
    <line x1="0" y1="20" x2="90" y2="20" stroke="#2b6cb0" stroke-width="2.5"/><text x="45" y="14" font-size="11" fill="#2b6cb0" text-anchor="middle">E_c</text>
    <line x1="0" y1="200" x2="90" y2="200" stroke="#2b6cb0" stroke-width="2.5"/><text x="45" y="216" font-size="11" fill="#2b6cb0" text-anchor="middle">E_v</text>
    <line x1="8" y1="34" x2="82" y2="34" stroke="#9c6b2a" stroke-width="2" stroke-dasharray="4 3"/><text x="45" y="48" font-size="10.5" fill="#9c6b2a" text-anchor="middle">도너 준위</text>
    <line x1="0" y1="110" x2="90" y2="110" stroke="#a0aec0" stroke-width="1" stroke-dasharray="2 3"/><text x="45" y="124" font-size="10.5" fill="#718096" text-anchor="middle">E_i</text>
    <line x1="0" y1="62" x2="90" y2="62" stroke="#2f855a" stroke-width="2.5"/><text x="45" y="76" font-size="11" fill="#2f855a" text-anchor="middle">E_F (위로)</text>
    <text x="45" y="240" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">n형</text>
    <!-- p -->
    <g transform="translate(120,0)">
      <line x1="0" y1="20" x2="90" y2="20" stroke="#2b6cb0" stroke-width="2.5"/><text x="45" y="14" font-size="11" fill="#2b6cb0" text-anchor="middle">E_c</text>
      <line x1="0" y1="200" x2="90" y2="200" stroke="#2b6cb0" stroke-width="2.5"/><text x="45" y="216" font-size="11" fill="#2b6cb0" text-anchor="middle">E_v</text>
      <line x1="8" y1="186" x2="82" y2="186" stroke="#2f855a" stroke-width="2" stroke-dasharray="4 3"/><text x="45" y="180" font-size="10.5" fill="#2f855a" text-anchor="middle">억셉터 준위</text>
      <line x1="0" y1="110" x2="90" y2="110" stroke="#a0aec0" stroke-width="1" stroke-dasharray="2 3"/><text x="45" y="104" font-size="10.5" fill="#718096" text-anchor="middle">E_i</text>
      <line x1="0" y1="158" x2="90" y2="158" stroke="#2f855a" stroke-width="2.5"/><text x="45" y="152" font-size="11" fill="#2f855a" text-anchor="middle">E_F (아래로)</text>
      <text x="45" y="240" font-size="13" font-weight="700" fill="#1f2328" text-anchor="middle">p형</text>
    </g>
  </g>
  <text x="745" y="318" font-size="12" fill="#444" text-anchor="middle">도펀트 준위가 밴드 가장자리에 아주 가까워</text>
  <text x="745" y="336" font-size="12" fill="#444" text-anchor="middle">상온에서 거의 모두 이온화된다</text>
  <text x="440" y="380" font-size="11.5" fill="#777" text-anchor="middle">실제 결정은 3차원 다이아몬드 구조 — 여기서는 공유결합을 평면으로 펼쳐 그림</text>
</svg>
