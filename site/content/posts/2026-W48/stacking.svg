<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <rect width="860" height="460" fill="#ffffff"/>
  <!-- (a) 2단 -->
  <text x="190" y="34" font-size="18" font-weight="700" fill="#1f2328" text-anchor="middle">(a) 2단 적층 (비교 기준 FFET)</text>
  <rect x="80" y="70" width="220" height="30" fill="#f6ad55" stroke="#9c6b2a"/>
  <text x="190" y="90" font-size="13" fill="#333" text-anchor="middle">앞면 배선</text>
  <rect x="80" y="110" width="220" height="50" fill="#4a7fc1"/>
  <text x="190" y="140" font-size="14" fill="#fff" text-anchor="middle">트랜지스터 층 1</text>
  <rect x="80" y="165" width="220" height="50" fill="#e06666"/>
  <text x="190" y="195" font-size="14" fill="#fff" text-anchor="middle">트랜지스터 층 2</text>
  <rect x="80" y="225" width="220" height="30" fill="#f6ad55" stroke="#9c6b2a"/>
  <text x="190" y="245" font-size="13" fill="#333" text-anchor="middle">뒷면 배선</text>

  <!-- (b) 4단 -->
  <text x="610" y="34" font-size="18" font-weight="700" fill="#1f2328" text-anchor="middle">(b) 4단 적층 CFFET (논문 제안)</text>
  <rect x="500" y="60" width="220" height="26" fill="#f6ad55" stroke="#9c6b2a"/>
  <text x="610" y="78" font-size="13" fill="#333" text-anchor="middle">앞면 배선</text>
  <rect x="500" y="90" width="220" height="34" fill="#4a7fc1"/><text x="610" y="112" font-size="13" fill="#fff" text-anchor="middle">층 1</text>
  <rect x="500" y="126" width="220" height="34" fill="#e06666"/><text x="610" y="148" font-size="13" fill="#fff" text-anchor="middle">층 2</text>
  <rect x="500" y="164" width="220" height="34" fill="#4a7fc1"/><text x="610" y="186" font-size="13" fill="#fff" text-anchor="middle">층 3</text>
  <rect x="500" y="200" width="220" height="34" fill="#e06666"/><text x="610" y="222" font-size="13" fill="#fff" text-anchor="middle">층 4</text>
  <rect x="500" y="238" width="220" height="26" fill="#f6ad55" stroke="#9c6b2a"/>
  <text x="610" y="256" font-size="13" fill="#333" text-anchor="middle">뒷면 배선</text>
  <!-- MOL 접점 -->
  <rect x="724" y="90" width="10" height="144" fill="#555"/>
  <text x="742" y="150" font-size="12" fill="#555">MOL 수직</text>
  <text x="742" y="166" font-size="12" fill="#555">접점 (복잡)</text>
  <text x="610" y="290" font-size="13" fill="#555" text-anchor="middle">CFET 2개를 뒤집어 양면에 만든 구조 (flipped CFET-to-CFET)</text>

  <!-- 결과 막대 -->
  <text x="430" y="330" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">논문 결과 — 셀 높이 감소가 칩 면적 감소로 그대로 이어지지 않는다</text>
  <text x="250" y="365" font-size="13" fill="#333" text-anchor="end">명목 셀 높이 감소</text>
  <rect x="260" y="350" width="400" height="22" fill="#9aa4b1"/>
  <text x="668" y="366" font-size="13" fill="#333">40%</text>
  <text x="250" y="397" font-size="13" fill="#333" text-anchor="end">RISC-V 코어 면적 감소</text>
  <rect x="260" y="382" width="128" height="22" fill="#4a7fc1"/>
  <text x="396" y="398" font-size="13" fill="#333">12.8%</text>
  <text x="250" y="429" font-size="13" fill="#333" text-anchor="end">같은 전력에서 속도</text>
  <rect x="260" y="414" width="109" height="22" fill="#e06666"/>
  <text x="377" y="430" font-size="13" fill="#333">10.9% 느림</text>
</svg>
