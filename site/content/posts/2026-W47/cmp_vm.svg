<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <rect width="880" height="360" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,0 L5,10 z" fill="#c53030"/></marker>
  </defs>

  <!-- (a) CMP 장비 개념도 -->
  <text x="20" y="30" font-size="16" font-weight="700" fill="#1f2328">(a) CMP 장비 개념도 (옆에서 본 모습)</text>
  <!-- platen + pad -->
  <rect x="30" y="200" width="340" height="26" rx="4" fill="#9aa5b1"/>
  <rect x="30" y="186" width="340" height="14" fill="#4a5568"/>
  <text x="200" y="244" font-size="12" fill="#333" text-anchor="middle">플래튼(회전 테이블) + 연마 패드</text>
  <path d="M120 262 a80 10 0 0 0 160 0" fill="none" stroke="#777" stroke-width="1.6" marker-end="url(#a)"/>
  <!-- carrier + wafer -->
  <rect x="80" y="130" width="110" height="40" rx="6" fill="#2b6cb0"/>
  <rect x="88" y="170" width="94" height="10" fill="#c9a227"/>
  <line x1="135" y1="70" x2="135" y2="128" stroke="#c53030" stroke-width="3" marker-end="url(#d)"/>
  <text x="145" y="88" font-size="12.5" font-weight="700" fill="#c53030">압력 P</text>
  <text x="135" y="155" font-size="12" fill="#fff" text-anchor="middle">캐리어(헤드)</text>
  <text x="200" y="182" font-size="11.5" fill="#7b5a12">웨이퍼 (뒤집어서)</text>
  <!-- slurry -->
  <path d="M230 70 L230 120" stroke="#555" stroke-width="5"/>
  <g fill="#38a169"><circle cx="230" cy="135" r="4"/><circle cx="230" cy="152" r="4"/><circle cx="230" cy="170" r="4"/></g>
  <text x="240" y="80" font-size="12.5" fill="#2f855a">슬러리 (연마 입자 + 약액)</text>
  <!-- conditioner -->
  <rect x="290" y="150" width="60" height="34" rx="5" fill="#718096"/>
  <rect x="294" y="184" width="52" height="4" fill="#cbd5e0"/>
  <text x="320" y="140" font-size="12" fill="#333" text-anchor="middle">패드 컨디셔너</text>
  <text x="320" y="124" font-size="11" fill="#777" text-anchor="middle">(아래 사진의 다이아몬드 디스크)</text>
  <!-- Preston -->
  <rect x="30" y="285" width="340" height="58" rx="8" fill="#f3f6f1" stroke="#7a9a6a"/>
  <text x="200" y="309" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">프레스턴 식: MRR ≈ Kₚ · P · V</text>
  <text x="200" y="330" font-size="12" fill="#555" text-anchor="middle">P 압력, V 상대 속도, Kₚ 패드·슬러리·막질에 따른 계수</text>

  <!-- (b) 가상계측 흐름 -->
  <text x="420" y="30" font-size="16" font-weight="700" fill="#1f2328">(b) 이번 논문의 가상계측 흐름</text>
  <g font-size="13">
    <rect x="430" y="52" width="420" height="44" rx="8" fill="#edf2f7" stroke="#a0aec0"/>
    <text x="640" y="72" text-anchor="middle" font-weight="700" fill="#1f2328">장비 센서 시계열 (라벨 없음, 대량)</text>
    <text x="640" y="89" text-anchor="middle" font-size="11.5" fill="#555">예: 모터 토크·온도·압력 등 — 구체 센서는 원문 미공개</text>
    <line x1="640" y1="96" x2="640" y2="116" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
    <rect x="430" y="118" width="420" height="44" rx="8" fill="#ebf4ff" stroke="#2b6cb0"/>
    <text x="640" y="138" text-anchor="middle" font-weight="700" fill="#1f3d66">① 자기지도 사전학습 (GREP)</text>
    <text x="640" y="155" text-anchor="middle" font-size="11.5" fill="#555">어텐션 모델이 신호의 시간 패턴 자체를 학습</text>
    <line x1="640" y1="162" x2="640" y2="182" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
    <rect x="430" y="184" width="420" height="44" rx="8" fill="#ebf4ff" stroke="#2b6cb0"/>
    <text x="640" y="204" text-anchor="middle" font-weight="700" fill="#1f3d66">② 미세조정 (소수의 실측 MRR 라벨)</text>
    <text x="640" y="221" text-anchor="middle" font-size="11.5" fill="#555">두께를 실제로 잰 웨이퍼만 사용</text>
    <line x1="640" y1="228" x2="640" y2="248" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
    <rect x="430" y="250" width="200" height="44" rx="8" fill="#f0fff4" stroke="#38a169"/>
    <text x="530" y="277" text-anchor="middle" font-weight="700" fill="#22543d">웨이퍼별 MRR 예측</text>
    <line x1="630" y1="272" x2="648" y2="272" stroke="#444" stroke-width="2" marker-end="url(#a)"/>
    <rect x="650" y="250" width="200" height="44" rx="8" fill="#fffaf0" stroke="#d69e2e"/>
    <text x="750" y="269" text-anchor="middle" font-weight="700" fill="#7b5a12">다음 웨이퍼 연마 시간 보정</text>
    <text x="750" y="286" text-anchor="middle" font-size="11.5" fill="#7b5a12">(Run-to-Run 제어, 활용 예)</text>
    <text x="640" y="322" text-anchor="middle" font-size="12" fill="#555">평가 조건: 라벨 부족 · 센서 노이즈 · 시간에 따른 공정 드리프트</text>
  </g>
</svg>
