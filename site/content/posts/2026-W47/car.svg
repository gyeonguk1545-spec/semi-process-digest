<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <rect width="880" height="330" fill="#ffffff"/>
  <defs>
    <marker id="la" viewBox="0 0 10 10" refX="5" refY="9" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,0 L5,10 z" fill="#d69e2e"/></marker>
    <marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker>
  </defs>

  <!-- ① 노광 -->
  <g transform="translate(15,0)">
    <text x="100" y="30" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">① 노광</text>
    <g stroke="#d69e2e" stroke-width="2">
      <line x1="30" y1="44" x2="30" y2="68"/><line x1="60" y1="44" x2="60" y2="68"/>
      <line x1="140" y1="44" x2="140" y2="68"/><line x1="170" y1="44" x2="170" y2="68"/>
      <line x1="85" y1="44" x2="85" y2="126" marker-end="url(#la)"/><line x1="115" y1="44" x2="115" y2="126" marker-end="url(#la)"/>
    </g>
    <rect x="10" y="70" width="60" height="12" fill="#2d3748"/><rect x="130" y="70" width="60" height="12" fill="#2d3748"/>
    <text x="196" y="80" font-size="11" fill="#555">마스크</text>
    <rect x="10" y="130" width="180" height="60" fill="#f8d7e8" stroke="#c27aa0"/>
    <rect x="70" y="130" width="60" height="60" fill="#f1b4d2"/>
    <g font-size="12" font-weight="700" fill="#c53030"><text x="76" y="152">H⁺</text><text x="102" y="168">H⁺</text><text x="80" y="184">H⁺</text></g>
    <rect x="10" y="190" width="180" height="45" fill="#b0b4ba"/>
    <text x="100" y="262" font-size="12.5" fill="#444" text-anchor="middle">빛 받은 PAG(광산발생제)가</text>
    <text x="100" y="278" font-size="12.5" fill="#444" text-anchor="middle">산(H⁺)을 만든다</text>
  </g>
  <line x1="215" y1="160" x2="232" y2="160" stroke="#999" stroke-width="2" marker-end="url(#sa)"/>

  <!-- ② PEB -->
  <g transform="translate(235,0)">
    <text x="100" y="30" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">② 노광 후 베이크(PEB)</text>
    <rect x="10" y="130" width="180" height="60" fill="#f8d7e8" stroke="#c27aa0"/>
    <rect x="70" y="130" width="60" height="60" fill="#f1b4d2"/>
    <g stroke="#6b4f63" stroke-width="2"><line x1="14" y1="145" x2="186" y2="145"/><line x1="14" y1="160" x2="186" y2="160"/><line x1="14" y1="175" x2="186" y2="175"/></g>
    <g fill="#2b6cb0">
      <circle cx="22" cy="145" r="4"/><circle cx="40" cy="145" r="4"/><circle cx="58" cy="145" r="4"/><circle cx="142" cy="145" r="4"/><circle cx="160" cy="145" r="4"/><circle cx="178" cy="145" r="4"/>
      <circle cx="30" cy="160" r="4"/><circle cx="48" cy="160" r="4"/><circle cx="150" cy="160" r="4"/><circle cx="168" cy="160" r="4"/>
      <circle cx="22" cy="175" r="4"/><circle cx="40" cy="175" r="4"/><circle cx="58" cy="175" r="4"/><circle cx="142" cy="175" r="4"/><circle cx="160" cy="175" r="4"/><circle cx="178" cy="175" r="4"/>
    </g>
    <g font-size="10" fill="#2f855a"><text x="74" y="141">OH</text><text x="104" y="141">OH</text><text x="86" y="171">OH</text></g>
    <path d="M92 118 a12 8 0 1 1 18 0" fill="none" stroke="#c53030" stroke-width="2"/>
    <text x="100" y="108" font-size="12" font-weight="700" fill="#c53030" text-anchor="middle">H⁺ 재생</text>
    <rect x="10" y="190" width="180" height="45" fill="#b0b4ba"/>
    <g stroke="#e53e3e" stroke-width="2" fill="none"><path d="M40 248 q6 -6 12 0 q6 6 12 0"/><path d="M136 248 q6 -6 12 0 q6 6 12 0"/></g>
    <g font-size="11" fill="#555"><circle cx="18" cy="72" r="4" fill="#2b6cb0"/><text x="27" y="76">보호기 (녹지 않게 막음)</text></g>
    <text x="100" y="270" font-size="12.5" fill="#444" text-anchor="middle">가열하면 산이 보호기를 연달아 떼고</text>
    <text x="100" y="286" font-size="12.5" fill="#444" text-anchor="middle">자신은 다시 살아남음 → "화학 증폭"</text>
  </g>
  <line x1="435" y1="160" x2="452" y2="160" stroke="#999" stroke-width="2" marker-end="url(#sa)"/>

  <!-- ③ 현상 -->
  <g transform="translate(455,0)">
    <text x="100" y="30" font-size="15" font-weight="700" fill="#1f2328" text-anchor="middle">③ 현상</text>
    <rect x="10" y="130" width="60" height="60" fill="#f8d7e8" stroke="#c27aa0"/>
    <rect x="130" y="130" width="60" height="60" fill="#f8d7e8" stroke="#c27aa0"/>
    <rect x="10" y="190" width="180" height="45" fill="#b0b4ba"/>
    <text x="100" y="166" font-size="12" fill="#777" text-anchor="middle">녹아 없어짐</text>
    <text x="100" y="262" font-size="12.5" fill="#444" text-anchor="middle">노광된 부분만 현상액에 녹음</text>
    <text x="100" y="278" font-size="12.5" fill="#444" text-anchor="middle">(포지티브형) → 식각 마스크가 됨</text>
  </g>

  <!-- EUV 고민 -->
  <g transform="translate(680,40)">
    <rect x="0" y="0" width="185" height="230" rx="10" fill="#fff8e6" stroke="#d69e2e"/>
    <text x="92" y="26" font-size="14" font-weight="700" fill="#7b5a12" text-anchor="middle">EUV에서 생기는 문제</text>
    <g font-size="12" fill="#444">
      <text x="12" y="54">· 광자 에너지가 커서(약 92 eV)</text>
      <text x="12" y="72">  같은 선량이면 광자 수가 적음</text>
      <text x="12" y="98">· 작은 영역에 들어오는 광자·</text>
      <text x="12" y="116">  산 개수가 들쭉날쭉 →</text>
      <text x="12" y="134" font-weight="700" fill="#9c3b2a">  확률적 결함(stochastic)</text>
      <text x="12" y="160">· 산이 확산하며 경계를 흐림</text>
      <text x="12" y="186">· 대안 연구: 금속산화물</text>
      <text x="12" y="204">  레지스트(MOR) 등</text>
    </g>
  </g>
</svg>
