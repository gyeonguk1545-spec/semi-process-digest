<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" width="820" height="400" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif">
  <rect width="820" height="400" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <pattern id="cells" width="10" height="10" patternUnits="userSpaceOnUse"><rect width="10" height="10" fill="#4a7fc1"/><path d="M10 0V10M0 10H10" stroke="#3a679f" stroke-width="1"/></pattern>
  </defs>

  <!-- (a) 기존 -->
  <text x="185" y="40" font-size="18" font-weight="700" fill="#1f2328" text-anchor="middle">(a) 기존 D램 — 한 웨이퍼</text>
  <rect x="60" y="70" width="250" height="230" rx="6" fill="#f6ad55" stroke="#9c6b2a" stroke-width="2"/>
  <rect x="75" y="85" width="100" height="90" fill="url(#cells)"/>
  <rect x="195" y="85" width="100" height="90" fill="url(#cells)"/>
  <rect x="75" y="195" width="100" height="90" fill="url(#cells)"/>
  <rect x="195" y="195" width="100" height="90" fill="url(#cells)"/>
  <text x="185" y="322" font-size="14" fill="#444" text-anchor="middle">다이 평면도 (위에서 본 모습)</text>
  <text x="185" y="345" font-size="13" fill="#9c6b2a" text-anchor="middle">주변회로가 셀 사이·가장자리 면적을 차지</text>
  <text x="185" y="366" font-size="13" fill="#9c6b2a" text-anchor="middle">셀 공정(고온 커패시터 등)에 주변회로도 묶임</text>

  <!-- arrow -->
  <line x1="340" y1="190" x2="440" y2="190" stroke="#444" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="390" y="176" font-size="13" fill="#444" text-anchor="middle">따로 만들어</text>
  <text x="390" y="212" font-size="13" fill="#444" text-anchor="middle">W2W 접합</text>

  <!-- (b) D0A -->
  <text x="620" y="40" font-size="18" font-weight="700" fill="#1f2328" text-anchor="middle">(b) D0A — 두 웨이퍼를 붙임</text>
  <rect x="470" y="90" width="300" height="62" rx="4" fill="#f6ad55" stroke="#9c6b2a" stroke-width="2"/>
  <text x="620" y="118" font-size="15" font-weight="700" fill="#5a3a10" text-anchor="middle">주변회로 웨이퍼 · D1d</text>
  <text x="620" y="139" font-size="12.5" fill="#5a3a10" text-anchor="middle">센스앰프·디코더 등 로직 (더 미세한 공정)</text>
  <rect x="470" y="152" width="300" height="18" fill="#dfe6ee"/>
  <g fill="#b87333">
    <rect x="482" y="152" width="14" height="18"/><rect x="512" y="152" width="14" height="18"/><rect x="542" y="152" width="14" height="18"/>
    <rect x="572" y="152" width="14" height="18"/><rect x="602" y="152" width="14" height="18"/><rect x="632" y="152" width="14" height="18"/>
    <rect x="662" y="152" width="14" height="18"/><rect x="692" y="152" width="14" height="18"/><rect x="722" y="152" width="14" height="18"/>
    <rect x="752" y="152" width="14" height="18"/>
  </g>
  <rect x="470" y="170" width="300" height="62" rx="4" fill="url(#cells)" stroke="#2c4f7c" stroke-width="2"/>
  <text x="620" y="198" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">셀 웨이퍼 · D1b</text>
  <text x="620" y="219" font-size="12.5" fill="#ffffff" text-anchor="middle">트랜지스터 + 커패시터 어레이 (6F²)</text>
  <text x="620" y="258" font-size="13" fill="#b87333" text-anchor="middle">접합면: 하이브리드 본딩 (Cu–Cu + 산화막–산화막) 예상</text>
  <text x="620" y="290" font-size="14" fill="#444" text-anchor="middle">단면도 (옆에서 본 모습)</text>
  <text x="620" y="322" font-size="13" fill="#2c4f7c" text-anchor="middle">셀 웨이퍼는 거의 전부 셀로 채움 → 집적도 ↑</text>
  <text x="620" y="345" font-size="13" fill="#2c4f7c" text-anchor="middle">주변회로는 셀 공정 제약 없이 별도 최적화</text>
  <text x="620" y="366" font-size="13" fill="#9c6b2a" text-anchor="middle">대가: 웨이퍼 2장, 정렬 오차, 불량 다이 동반 손실</text>
</svg>
