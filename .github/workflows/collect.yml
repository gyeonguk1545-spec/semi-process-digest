# 매일 아침 9시(KST) 뉴스·논문 수집 → data/items/ 에 커밋 (AI 미사용, 무료)
name: collect

on:
  schedule:
    - cron: "0 0 * * *"   # UTC 00:00 = KST 09:00
  workflow_dispatch:       # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install feedparser requests pyyaml

      - name: Collect
        run: python collector/collect.py

      - name: Commit new items
        run: |
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "새 글 없음"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data: $(date -u +%F) 수집"
          git pull --rebase
          git push
